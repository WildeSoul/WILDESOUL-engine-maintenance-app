name: Engine Maintenance MLOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ──────────────────────────────────
  # Stage 1: Train & Evaluate Models
  # ──────────────────────────────────
  train:
    runs-on: ubuntu-latest
    outputs:
      model_ready: ${{ steps.quality.outputs.passed }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('deployment/requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r deployment/requirements.txt
        pip install jupyter nbconvert jupytext huggingface_hub mlflow matplotlib seaborn imbalanced-learn shap lightgbm plotly

    - name: Convert and Execute Notebook
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        jupytext --to notebook predictive_maintenance.py
        jupyter nbconvert --to notebook --execute predictive_maintenance.ipynb --ExecutePreprocessor.timeout=1800

    - name: Quality Gate Check
      id: quality
      run: |
        python -c "
        import json
        with open('model_building/model_comparison.json') as f:
            data = json.load(f)
        best = data['best_model']
        f1 = data['results'][best]['f1_score']
        auc = data['results'][best]['auc_roc']
        print(f'Best Model: {best} | F1: {f1:.4f} | AUC: {auc:.4f}')
        if f1 < 0.60 or auc < 0.65:
            print('::error::Quality Gate FAILED')
            exit(1)
        print('Quality Gate PASSED')
        print(f'::set-output name=passed::true')
        "

    - name: Upload Training Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: trained-model
        path: |
          model_building/best_model.joblib
          model_building/feature_info.json
          model_building/model_comparison.json
          model_building/plots/

  # ──────────────────────────────────
  # Stage 2: Deploy to HuggingFace
  # ──────────────────────────────────
  deploy:
    needs: train
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Download Model Artifacts
      uses: actions/download-artifact@v3
      with:
        name: trained-model
        path: model_building/

    - name: Deploy to Hugging Face Space
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        git config --global user.email "github-actions@github.com"
        git config --global user.name "GitHub Actions"

        git clone https://WildeSoul:$HF_TOKEN@huggingface.co/spaces/WILDESOUL/engine-maintenance-app hf_space
