name: Engine Maintenance MLOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    steps:

    # -- Step 1: Setup --
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('deployment/requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r deployment/requirements.txt
        pip install jupyter nbconvert jupytext huggingface_hub mlflow matplotlib seaborn imbalanced-learn shap lightgbm plotly scipy
        pip install torch --index-url https://download.pytorch.org/whl/cpu

    # -- Step 2: Data Registration & EDA --
    # Registers data on HuggingFace dataset space
    # Performs EDA with univariate, bivariate, multivariate analysis
    # Cleans data, handles outliers, engineers features
    # Splits into train/test and uploads to HuggingFace
    - name: Data Registration and EDA
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        jupytext --to notebook predictive_maintenance.py
        echo "Converting to notebook and executing all ML steps..."

    # -- Step 3: Model Training & Experiment Tracking --
    # Trains Decision Tree, Bagging, Random Forest, AdaBoost,
    # Gradient Boosting, XGBoost, LightGBM + Voting Ensemble
    # Logs all parameters and metrics to MLflow
    - name: Model Training with MLflow Tracking
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        jupyter nbconvert --to notebook --execute predictive_maintenance.ipynb --ExecutePreprocessor.timeout=1800

    # -- Step 4: Quality Gate --
    - name: Quality Gate - Verify Model Performance
      run: |
        python -c "
        import json
        with open('model_building/model_comparison.json') as f:
            data = json.load(f)
        best = data['best_model']
        f1 = data['results'][best]['f1_score']
        auc = data['results'][best]['auc_roc']
        print(f'Best Model: {best}')
        print(f'F1 Score: {f1:.4f}')
        print(f'AUC-ROC: {auc:.4f}')
        assert f1 >= 0.60 and auc >= 0.65, 'Quality Gate FAILED: Model below threshold'
        print('Quality Gate PASSED')
        "

    # -- Step 5: Model Registration on HuggingFace Hub --
    - name: Register Best Model on HuggingFace Model Hub
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        python -c "
        from huggingface_hub import HfApi
        import os, glob
        token = os.environ['HF_TOKEN']
        api = HfApi()
        user = api.whoami(token=token)['name']
        repo = f'{user}/engine-maintenance-model'
        api.create_repo(repo_id=repo, exist_ok=True, token=token)
        for f in ['best_model.joblib','feature_info.json','model_comparison.json','classification_report.json']:
            p = f'model_building/{f}'
            if os.path.exists(p):
                api.upload_file(path_or_fileobj=p, path_in_repo=f, repo_id=repo, token=token)
                print(f'Uploaded {f} to {repo}')
        for fpath in glob.glob('model_building/plots/*.png'):
            api.upload_file(path_or_fileobj=fpath, path_in_repo=f'plots/{os.path.basename(fpath)}', repo_id=repo, token=token)
        print(f'Model registered at: https://huggingface.co/{repo}')
        "

    # -- Step 6: Deploy to HuggingFace Space via API --
    - name: Deploy Streamlit App to HuggingFace Space
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        python -c "
        from huggingface_hub import HfApi
        import os, glob

        token = os.environ['HF_TOKEN']
        api = HfApi()
        space_repo = 'WILDESOUL/engine-maintenance-app'

        # Map of local files to repo paths
        files = {
            'deployment/app.py': 'app.py',
            'deployment/requirements.txt': 'requirements.txt',
            'deployment/README.md': 'README.md',
            'deployment/Dockerfile': 'Dockerfile',
            'model_building/best_model.joblib': 'best_model.joblib',
            'model_building/feature_info.json': 'feature_info.json',
            'model_building/model_comparison.json': 'model_comparison.json',
            'model_building/transformer_model.pt': 'model_building/transformer_model.pt',
            'model_building/transformer_scaler.joblib': 'model_building/transformer_scaler.joblib',
            'model_building/param_stats.json': 'model_building/param_stats.json',
            'model_building/evaluation_report.json': 'model_building/evaluation_report.json',
            'model_building/training_history.json': 'model_building/training_history.json',
            'model_building/shap_values.npy': 'model_building/shap_values.npy',
            'model_building/shap_feature_names.json': 'model_building/shap_feature_names.json',
            'model_building/shap_X_sample.npy': 'model_building/shap_X_sample.npy',
            'transformer_model.py': 'transformer_model.py',
            'config.py': 'config.py',
            'advanced_features.py': 'advanced_features.py',
        }

        uploaded = 0
        for local_path, repo_path in files.items():
            if os.path.exists(local_path):
                try:
                    api.upload_file(
                        path_or_fileobj=local_path,
                        path_in_repo=repo_path,
                        repo_id=space_repo,
                        repo_type='space',
                        token=token
                    )
                    print(f'[OK] {local_path} -> {repo_path}')
                    uploaded += 1
                except Exception as e:
                    print(f'[WARN] {local_path}: {e}')

        # Upload plots
        for fpath in glob.glob('model_building/plots/*.png'):
            try:
                api.upload_file(
                    path_or_fileobj=fpath,
                    path_in_repo=f'model_building/plots/{os.path.basename(fpath)}',
                    repo_id=space_repo,
                    repo_type='space',
                    token=token
                )
                uploaded += 1
            except Exception as e:
                print(f'[WARN] {fpath}: {e}')

        print(f'Deployed {uploaded} files to https://huggingface.co/spaces/{space_repo}')
        "
