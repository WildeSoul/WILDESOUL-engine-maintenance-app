name: Engine Maintenance MLOps Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('deployment/requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r deployment/requirements.txt
        pip install jupyter nbconvert jupytext huggingface_hub mlflow matplotlib seaborn imbalanced-learn shap lightgbm plotly scipy
        pip install torch --index-url https://download.pytorch.org/whl/cpu

    - name: Train Traditional Models
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        jupytext --to notebook predictive_maintenance.py
        jupyter nbconvert --to notebook --execute predictive_maintenance.ipynb --ExecutePreprocessor.timeout=1800

    - name: Quality Gate
      run: |
        python -c "
        import json
        with open('model_building/model_comparison.json') as f:
            data = json.load(f)
        best = data['best_model']
        f1 = data['results'][best]['f1_score']
        auc = data['results'][best]['auc_roc']
        print(f'Best: {best} | F1: {f1:.4f} | AUC: {auc:.4f}')
        assert f1 >= 0.60 and auc >= 0.65, 'Quality Gate FAILED'
        print('Quality Gate PASSED')
        "

    - name: Deploy to HuggingFace
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        git config --global user.email "github-actions@github.com"
        git config --global user.name "GitHub Actions"
        git clone https://WildeSoul:$HF_TOKEN@huggingface.co/spaces/WILDESOUL/engine-maintenance-app hf_space
        rm -f hf_space/Dockerfile

        # Core app files
        cp deployment/app.py hf_space/
        cp deployment/requirements.txt hf_space/
        cp deployment/README.md hf_space/

        # Traditional ML model
        cp model_building/best_model.joblib hf_space/
        cp model_building/feature_info.json hf_space/ 2>/dev/null || true
        cp model_building/model_comparison.json hf_space/ 2>/dev/null || true

        # Transformer model & artifacts (if trained locally and committed)
        mkdir -p hf_space/model_building/plots
        cp model_building/transformer_model.pt hf_space/model_building/ 2>/dev/null || true
        cp model_building/transformer_scaler.joblib hf_space/model_building/ 2>/dev/null || true
        cp model_building/param_stats.json hf_space/model_building/ 2>/dev/null || true
        cp model_building/evaluation_report.json hf_space/model_building/ 2>/dev/null || true
        cp model_building/training_history.json hf_space/model_building/ 2>/dev/null || true
        cp model_building/shap_values.npy hf_space/model_building/ 2>/dev/null || true
        cp model_building/shap_feature_names.json hf_space/model_building/ 2>/dev/null || true
        cp model_building/shap_X_sample.npy hf_space/model_building/ 2>/dev/null || true
        cp model_building/plots/*.png hf_space/model_building/plots/ 2>/dev/null || true

        # Transformer model source (for loading)
        cp transformer_model.py hf_space/ 2>/dev/null || true
        cp config.py hf_space/ 2>/dev/null || true
        cp advanced_features.py hf_space/ 2>/dev/null || true

        cd hf_space
        git add .
        git commit -m "Deploy: upgraded Control Room dashboard with FT-Transformer + LoRA" || echo "No changes"
        git push origin main
